<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e7c86">
<meta name="description" content="Ritmo: hábitos de ejercicio y alimentación con un pingüino multicolor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<title>Ritmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: una sola columna móvil, tarjetas por tarea del día, navegación inferior fija. Mundo polar con aurora. */
:root{
  --bg:#eaf1f7;
  --surface:#ffffff;
  --surface-2:#f3f7fb;
  --ink:#13233d;
  --muted:#5a6b85;
  --line:#d5dfea;
  --accent:#0e7c86;
  --accent-ink:#ffffff;
  --accent-soft:#d9f0ef;
  --good:#2b8a5b;
  --warn:#b26a00;
  --warn-soft:#fff2db;
  --calm-soft:#e8ecff;
  --display:"Fredoka", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px;
  color-scheme:light;
}
/* Temas claros */
:root[data-palette="atardecer"]{--bg:#fbf0e9;--surface:#ffffff;--surface-2:#fdf5f0;--ink:#3a1f1a;--muted:#85625a;--line:#efd9cf;--accent:#d4553a;--accent-ink:#ffffff;--accent-soft:#fde2d6;--calm-soft:#fde9d9}
:root[data-palette="selva"]{--bg:#edf3ec;--surface:#ffffff;--surface-2:#f4f8f3;--ink:#16281c;--muted:#5a7062;--line:#d3e0d3;--accent:#2f7a4a;--accent-ink:#ffffff;--accent-soft:#dcefe0;--calm-soft:#f1e4f3}
:root[data-palette="lavanda"]{--bg:#f1eef9;--surface:#ffffff;--surface-2:#f7f5fc;--ink:#221a3d;--muted:#6a6189;--line:#ddd6ef;--accent:#6b4fc8;--accent-ink:#ffffff;--accent-soft:#e6defa;--calm-soft:#e3e8fb}
/* Temas oscuros */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1322; --surface:#121f36; --surface-2:#182844; --ink:#e7eef8; --muted:#9aabc4;
    --line:#26385a; --accent:#4fd1c5; --accent-ink:#06222a; --accent-soft:#143a44;
    --good:#5fd39a; --warn:#f2b45a; --warn-soft:#3a2a10; --calm-soft:#1f2850;
    color-scheme:dark;
  }
  :root[data-palette="atardecer"]:not([data-theme="light"]){--bg:#1d1210;--surface:#2a1a16;--surface-2:#35211c;--ink:#fbeee8;--muted:#c9a69b;--line:#4a2f28;--accent:#ff8a65;--accent-ink:#2a1008;--accent-soft:#4a2418;--calm-soft:#3a2218}
  :root[data-palette="selva"]:not([data-theme="light"]){--bg:#0d1710;--surface:#142219;--surface-2:#1a2c20;--ink:#e6f1e8;--muted:#9bb5a2;--line:#26402e;--accent:#6fcf8e;--accent-ink:#08210f;--accent-soft:#1d3d27;--calm-soft:#2e2238}
  :root[data-palette="lavanda"]:not([data-theme="light"]){--bg:#120f22;--surface:#1b1730;--surface-2:#241f3d;--ink:#ece8fb;--muted:#a69fc6;--line:#332c55;--accent:#b39dff;--accent-ink:#1a1033;--accent-soft:#2f2656;--calm-soft:#1f2550}
}
:root[data-theme="dark"]{
  --bg:#0a1322; --surface:#121f36; --surface-2:#182844; --ink:#e7eef8; --muted:#9aabc4;
  --line:#26385a; --accent:#4fd1c5; --accent-ink:#06222a; --accent-soft:#143a44;
  --good:#5fd39a; --warn:#f2b45a; --warn-soft:#3a2a10; --calm-soft:#1f2850;
  color-scheme:dark;
}
:root[data-theme="dark"][data-palette="atardecer"]{--bg:#1d1210;--surface:#2a1a16;--surface-2:#35211c;--ink:#fbeee8;--muted:#c9a69b;--line:#4a2f28;--accent:#ff8a65;--accent-ink:#2a1008;--accent-soft:#4a2418;--calm-soft:#3a2218}
:root[data-theme="dark"][data-palette="selva"]{--bg:#0d1710;--surface:#142219;--surface-2:#1a2c20;--ink:#e6f1e8;--muted:#9bb5a2;--line:#26402e;--accent:#6fcf8e;--accent-ink:#08210f;--accent-soft:#1d3d27;--calm-soft:#2e2238}
:root[data-theme="dark"][data-palette="lavanda"]{--bg:#120f22;--surface:#1b1730;--surface-2:#241f3d;--ink:#ece8fb;--muted:#a69fc6;--line:#332c55;--accent:#b39dff;--accent-ink:#1a1033;--accent-soft:#2f2656;--calm-soft:#1f2550}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:1.6rem}
h2{font-size:1.2rem}
h3{font-size:1rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top .date{font-size:.9rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:.8rem;font-weight:700;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:800;padding:6px 0}
/* Pet */
.pet-card{background:linear-gradient(180deg,var(--calm-soft),var(--surface) 75%);position:relative;overflow:hidden}
.pet-wrap{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.pet{width:150px;height:150px}
.pet svg{width:100%;height:100%;display:block}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:100px 190px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-1.5deg)}}
.wiggle{animation:wig 1.6s ease-in-out infinite;transform-origin:100px 175px}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-5deg)}90%{transform:rotate(5deg)}95%{transform:rotate(-3deg)}}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:.95rem}
.xpbar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#ff6b81,#ffa94d,#ffd84d,#5fd38d,#4db8ff,#8c7bff);border-radius:99px}
/* Chips */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale.six{grid-template-columns:repeat(6,1fr)}
.chip{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 4px;font-size:.78rem;font-weight:700;text-align:center;min-height:48px;line-height:1.15}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{padding:10px 14px;font-size:.9rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:800;font-size:.9rem;position:relative;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .rec{display:block;font-size:.66rem;color:var(--accent);font-weight:800}
.banner{border-radius:14px;padding:12px 14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft)}
.banner.calm{background:var(--calm-soft)}
.banner b{display:block}
.plan{display:flex;flex-direction:column;gap:10px}
.plan .sec{border-left:4px solid var(--line);padding-left:10px}
.plan .sec h3{font-size:.95rem}
.plan .sec p{margin:2px 0 0;color:var(--muted);font-size:.86rem}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.glass{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;height:44px;padding:0;position:relative;overflow:hidden}
.glass i{position:absolute;left:0;right:0;bottom:0;height:0;background:color-mix(in srgb,#4db8ff 70%,transparent);transition:height .25s}
.glass[aria-pressed="true"] i{height:78%}
.check{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2);text-align:left;width:100%;min-height:52px}
.check .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.check[aria-pressed="true"]{border-color:var(--good)}
.check[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--good)}
.dots i.today{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.72rem;font-weight:700;line-height:1.15}
.badge .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;color:#fff;background:conic-gradient(#ff6b81,#ffa94d,#ffd84d,#5fd38d,#4db8ff,#8c7bff,#ff6b81)}
.badge .medal span{width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.badge.locked{color:var(--muted)}
.badge.locked .medal{background:var(--line)}
.badge.locked .medal span{color:var(--muted)}
input[type=number],input[type=text],input[type=time],input[type=date]{font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9rem;flex:1;min-width:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.4px}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:10px 0 12px;font-weight:800;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:78px;z-index:6;border:0;border-radius:999px;padding:13px 18px;font-weight:800;background:var(--ink);color:var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;min-height:50px}
/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(6,14,28,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet .x{align-self:flex-end;border:0;background:var(--surface-2);border-radius:999px;padding:8px 14px;font-weight:800}
.breath{width:180px;height:180px;margin:6px auto;border-radius:50%;background:radial-gradient(circle,#8c7bff55,#4db8ff33 60%,transparent 70%);display:grid;place-items:center;position:relative}
.breath::before{content:"";position:absolute;inset:30px;border-radius:50%;background:linear-gradient(135deg,#ff6b81,#ffd84d,#5fd38d,#4db8ff,#8c7bff);opacity:.85;animation:breathe 10s ease-in-out infinite}
.breath span{position:relative;font-family:var(--display);font-size:1.1rem;color:#13233d;font-weight:600}
@keyframes breathe{0%{transform:scale(.55)}40%{transform:scale(1)}100%{transform:scale(.55)}}
.big-time{font-family:var(--display);font-size:2.6rem;text-align:center;font-variant-numeric:tabular-nums}
.player{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
.player.open{display:flex}
.player .in{max-width:520px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.ring{width:150px;height:150px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;font-variant-numeric:tabular-nums}
.ex-name{font-family:var(--display);font-size:1.5rem;text-align:center;text-wrap:balance}
.ex-cue{text-align:center;color:var(--muted);max-width:34ch;margin:0 auto}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;z-index:40;display:none;max-width:90%;text-align:center}
.toast.show{display:block}
.save-note{font-size:.75rem;color:var(--muted);text-align:center}
.list-plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.swatch{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;text-align:left;font-weight:800;font-size:.88rem}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.swatch .sw{display:flex;height:22px;border-radius:8px;overflow:hidden}
.swatch .sw i{flex:1;display:block}
.album{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.album .g{display:flex;flex-direction:column;align-items:center}
.album svg{width:100%;max-width:46px;height:auto}
.wardrobe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acc{border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:800;min-height:96px}
.acc svg{width:56px;height:56px}
.acc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.acc:disabled{opacity:.55;cursor:default}
.acc small{font-weight:600;color:var(--muted);font-size:.7rem}
.reward{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.reward svg{width:48px;height:48px;flex:none}
.recipe{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface-2)}
.recipe summary{padding:12px 14px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
.recipe summary::-webkit-details-marker{display:none}
.recipe summary::after{content:"+";font-family:var(--display);font-size:1.2rem;color:var(--accent)}
.recipe[open] summary::after{content:"–"}
.recipe .rb{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.med{display:flex;gap:12px;align-items:center}
.med .check{flex:1}
.summary-box{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:.9rem;white-space:pre-wrap;font-family:var(--body)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.thumb{flex:none;width:86px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:700;text-align:center;line-height:1.15;color:var(--ink)}
.thumb svg{width:76px;height:auto;display:block}
.p-fig{width:100%;max-width:280px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px}
.p-fig svg{display:block;width:100%;height:auto}
.ex-big{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:8px;max-width:340px;width:100%;margin:0 auto}
.ex-big svg{display:block;width:100%;height:auto}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){
  .bob,.wiggle,.breath::before{animation:none}
}
@media (max-width:380px){
  .pet-wrap{grid-template-columns:110px 1fr}
  .pet{width:110px;height:110px}
  .badges{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<main class="app" id="app"></main>

<button class="fab" id="fab" data-act="crave-open" aria-label="Tengo un antojo">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
  Tengo un antojo
</button>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-act="tab" data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
    <button data-act="tab" data-tab="comida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/></svg>Comida</button>
    <button data-act="tab" data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</button>
  </div>
</nav>

<div class="overlay" id="sheet" role="dialog" aria-modal="true" aria-label="Antojo"><div class="sheet" id="sheetBody"></div></div>
<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Rutina guiada"><div class="in" id="playerBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true" style="display:none"></canvas>

<script>
const PWA=true;
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(typeof render==="function")render()});
window.addEventListener("appinstalled",()=>{installEvt=null;if(typeof render==="function")render()});
/* ---------- Datos fijos ---------- */
const COLORS=["#ff6b81","#ffa94d","#ffd84d","#5fd38d","#4db8ff","#8c7bff"];
const STAGES=[

/* ---------- Estado ---------- */
const z=n=>String(n).padStart(2,"0");
function keyOf(d){return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function todayKey(){return keyOf(new Date())}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function diffDays(a,b){return Math.round((parseKey(b)-parseKey(a))/86400000)}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function freshState(){return {v:1,profile:{pet:"Iris",start:todayKey(),bedtime:"22:00",named:false,theme:"aurora",wear:{},meds:[],plan:{},bg:null,kind:"fuerza"},days:{},waist:[]}}

/* ---------- Guardado ---------- */
let dbRef=null,saving=false,pending=false,saveTimer=null;
function cacheLocal(){try{localStorage.setItem("ritmo-state",JSON.stringify(state))}catch(e){}}
function readLocal(){try{const s=localStorage.getItem("ritmo-state");return s?JSON.parse(s):null}catch(e){return null}}
function normalize(s){
  const b=freshState();
  if(!s||typeof s!=="object")return b;
  const pr=Object.assign(b.profile,JSON.parse(JSON.stringify(s.profile||{})));
  if(!pr.wear||typeof pr.wear!=="object")pr.wear={};
  if(!Array.isArray(pr.meds))pr.meds=[];
  if(!pr.plan||typeof pr.plan!=="object")pr.plan={};
  return {v:1,profile:pr,days:s.days&&typeof s.days==="object"?JSON.parse(JSON.stringify(s.days)):{},waist:Array.isArray(s.waist)?s.waist.slice():[]};
}
function save(){
  cacheLocal();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,500);
}
async function flush(){
  if(!dbRef){return}
  if(saving){pending=true;return}
  saving=true;
  try{
    await dbRef.set(JSON.parse(JSON.stringify(state)));
    saveStatus="Guardado en tu cuenta (privado)";
  }catch(e){
    if(e&&e.code==="unavailable"){
      await new Promise(r=>setTimeout(r,800+Math.random()*800));
      try{await dbRef.set(JSON.parse(JSON.stringify(state)));saveStatus="Guardado en tu cuenta (privado)"}catch(e2){saveStatus="No se pudo guardar. Revisa tu conexión."}
    }else if(e&&e.code==="quota_exceeded"){saveStatus="Se llenó el espacio de guardado."}
    else{saveStatus="No se pudo guardar en tu cuenta. Queda en este dispositivo."}
  }
  saving=false;
  updateSaveNote();
  if(pending){pending=false;flush()}
}
function updateSaveNote(){const n=document.getElementById("saveNote");if(n)n.textContent=saveStatus}

async function connect(){
  const local=readLocal();
  if(local){state=normalize(local)}
  saveStatus="Guardado en este celular";
  render();
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator){try{await navigator.serviceWorker.register("sw.js")}catch(e){}}
}

/* ---------- Lógica ---------- */
function dayXP(d){
  let x=0;
  if(d.checkin)x+=3;
  if(d.workout)x+=({normal:10,suave:8,minimo:6})[d.workout]||0;
  x+=Math.floor(Math.min(d.water||0,8)/2);
  if(d.habit)x+=3;
  const cr=d.cravings||[];
  x+=Math.min(cr.length,3)*3;
  x+=Math.min(cr.filter(c=>c.outcome==="paso").length,3)*5;
  const meds=state.profile.meds||[];
  if(meds.length&&d.meds&&meds.every(m=>d.meds[m.id]))x+=2;
  return x;
}
function superados(){return cravingsAll().filter(c=>c.outcome==="paso").length}
function unlocked(a){return superados()>=a.at}
function totalXP(){return Object.values(state.days).reduce((a,d)=>a+dayXP(d),0)+state.waist.length*5+completedChallenges()*20}
function challengeFor(w){
  const meds=state.profile.meds||[];
  let ch=CHALLENGES[(w-1)%CHALLENGES.length];
  if(ch.meds&&!meds.length)ch=CHALLENGES[0];
  return ch;
}
function challengeProgress(w){
  const ch=challengeFor(w),ws=addDays(state.profile.start,(w-1)*7);
  const keys=[...Array(7)].map((_,i)=>addDays(ws,i));
  let cur;
  if(ch.distinct)cur=new Set(keys.map(k=>getDay(k).workout?(getDay(k).kind||"fuerza"):null).filter(Boolean)).size;
  else if(ch.meds){const meds=state.profile.meds||[];cur=keys.filter(k=>{const d=getDay(k);return d.meds&&meds.every(m=>d.meds[m.id])}).length}
  else cur=keys.filter(ch.f).length;
  return {ch,cur:Math.min(cur,ch.goal),done:cur>=ch.goal,ws,we:keys[6]};
}
function completedChallenges(){let n=0;for(let w=1;w<=weekNum();w++){if(challengeProgress(w).done)n++}return n}
function phraseOfDay(){const d=new Date(),s=new Date(d.getFullYear(),0,0);return PHRASES[Math.floor((d-s)/86400000)%PHRASES.length]}
function stageOf(xp){let i=0;STAGES.forEach((s,j)=>{if(xp>=s.xp)i=j});return i}
function weekNum(){return Math.max(1,Math.floor(diffDays(state.profile.start,todayKey())/7)+1)}
function limitDate(){
  const [h,m]=(state.profile.bedtime||"22:00").split(":").map(Number);
  const d=new Date();d.setHours(h,m,0,0);d.setHours(d.getHours()-2);return d;
}
function limitLabel(){
  const d=limitDate();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?"pm":"am";h=h%12||12;
  return h+(m?":"+z(m):":00")+" "+ap;
}
function recommend(){
  const d=getDay(todayKey()),c=d.checkin;let mode="normal",why="",flags=[];
  if(c){
    const high=c.sleep<6&&c.energy>=4&&c.mood>=4;
    if(high){flags.push("high");mode=c.sleep<4?"suave":"normal";why="Mucha energía con poco sueño: hoy el plan normal, sin extras."}
    else if((c.mood===1&&c.energy<=2)||c.sleep<4){mode="minimo";why="Hoy toca cuidarte. Diez minutos cuentan igual."}
    else if(c.mood<=2||c.energy<=2){mode="suave";why="Día bajo: versión suave, sin exigirte."}
    else{why="Te sientes estable: vamos con el plan de la semana."}
  }
  if(new Date()>=limitDate()&&!d.workout){mode="minimo";flags.push("late")}
  return {mode,why,flags};
}
function trends(){
  let low=0,high=0,n=0;
  for(let i=0;i<7;i++){const c=getDay(addDays(todayKey(),-i)).checkin;if(!c)continue;n++;if(c.mood<=2)low++;if(c.sleep<6&&c.energy>=4&&c.mood>=4)high++}
  return {low,high,n};
}
function buildPlan(week,mode,kind){
  const S=(k,s)=>({k,n:EX[k].n,c:EX[k].c,s});
  const R=s=>({k:"rest",n:"Descanso",c:"Respira, toma agua si quieres.",s,rest:true});
  if(mode==="minimo"){
    const items=[S("marcha",60),S("cuello",45),S("cuadriceps",60),S("isquios",60),S("pecho",45),S("gato",60),S("respira",180)];
    return {minutes:Math.round(items.reduce((a,i)=>a+i.s,0)/60),secs:[{t:"Lo mínimo que cuenta",d:"Movilidad, estiramientos y respiración",items}],steps:items};
  }
  const cool=[S("cuadriceps",60),S("isquios",60),S("pecho",45),S("respira",90)];
  const pack=secs=>{const steps=secs.flatMap(s=>s.items);return {minutes:Math.round(steps.reduce((a,i)=>a+i.s,0)/60),secs,steps}};
  if(kind==="baile"){
    const moves=["b_merengue","b_salsa","b_cumbia","b_lado","b_brazos","b_libre"];
    let rounds,dur;
    if(mode==="suave"){rounds=1;dur=60}else if(week<=2){rounds=2;dur=60}else if(week<=4){rounds=3;dur=60}else if(week<=6){rounds=3;dur=75}else{rounds=3;dur=90}
    const block=[];
    for(let r=1;r<=rounds;r++){moves.forEach(k=>{const it=S(k,dur);it.round=r+" de "+rounds;block.push(it)});if(r<rounds){const a=S("b_agua",30);a.rest=true;block.push(a)}}
    return pack([{t:"Calentamiento",d:"Marcha con ritmo y brazos · 3 min",items:[S("b_marcha",120),S("b_brazos",60)]},
      {t:"Baile × "+rounds,d:"Merengue, salsa, cumbia, paso lateral, brazos y baile libre · "+dur+" s cada uno",items:block},
      {t:"Vuelta a la calma",d:"Estiramientos y respiración 4-6 · 4 min",items:cool}]);
  }
  if(kind==="yoga"){
    const hold=mode==="suave"?45:week<=2?45:week<=4?60:75;
    const standing=["y_montana","y_brazos","y_lateral","y_guerrero","y_arbol"].map(k=>S(k,hold));
    const floor=(mode==="suave"?["gato","y_nino","y_pared"]:["gato","y_nino","y_cobra","y_torsion","y_nino","y_pared"]).map(k=>S(k,k==="y_pared"?hold*2:hold));
    const secs=[];
    if(mode!=="suave")secs.push({t:"De pie",d:"Montaña, brazos arriba, lateral, guerrero y árbol · "+hold+" s cada una",items:standing});
    secs.push({t:"En el piso",d:floor.map(i=>i.n).join(", "),items:floor});
    secs.push({t:"Respiración",d:"Respiración 4-6 para preparar el sueño",items:[S("respira",mode==="suave"?120:180)]});
    return pack(secs);
  }
  if(kind==="caminata"){
    let main;
    if(mode==="suave")main=[S("c_ritmo",480)];
    else if(week<=2)main=[S("c_ritmo",600)];
    else if(week<=4)main=[S("c_ritmo",900)];
    else if(week<=6)main=[S("c_ritmo",1200)];
    else{main=[S("c_ritmo",600)];for(let i=0;i<4;i++){main.push(S("c_rapida",60));main.push(S("c_ritmo",120))}}
    return pack([{t:"Calentamiento",d:"Caminata suave · 4 min",items:[S("c_suave",240)]},
      {t:"Caminata",d:main.length>1?"Buen ritmo con 4 intervalos rápidos de 1 min":`Buen ritmo · ${Math.round(main[0].s/60)} min`,items:main},
      {t:"Regreso y estiramiento",d:"Baja el ritmo y estira · 6 min",items:[S("c_calma",180),...cool]}]);
  }
  let rounds,work,rest,walk,list=["sentadilla","pared","puente","lateral","talones","perro"];
  if(mode==="suave"){rounds=1;work=30;rest=30;walk=0}
  else if(week<=2){rounds=2;work=30;rest=30;walk=0}
  else if(week<=4){rounds=3;work=35;rest=25;walk=180}
  else if(week<=6){rounds=3;work=40;rest=20;walk=360;list.push("plancha")}
  else{rounds=4;work=40;rest=20;walk=360;list.push("plancha")}
  const warm=[S("marcha",60),S("brazos",45),S("cadera",45),S("rodillas",60)];
  const circuit=[];
  for(let r=1;r<=rounds;r++){list.forEach((k,i)=>{const it=S(k,work);it.round=r+" de "+rounds;circuit.push(it);if(!(r===rounds&&i===list.length-1))circuit.push(R(rest))})}
  const secs=[{t:"Calentamiento",d:"Marcha, brazos, cadera y rodillas · 3,5 min",items:warm},
    {t:"Circuito × "+rounds,d:list.map(k=>EX[k].n).join(", ")+" · "+work+" s cada uno, "+rest+" s de descanso",items:circuit}];
  if(walk)secs.push({t:"Caminata en el sitio",d:Math.round(walk/60)+" min a ritmo cómodo",items:[S("caminata",walk)]});
  secs.push({t:"Vuelta a la calma",d:"Estiramientos y respiración 4-6 · 4 min",items:cool});
  const steps=secs.flatMap(s=>s.items);
  return {minutes:Math.round(steps.reduce((a,i)=>a+i.s,0)/60),secs,steps};
}
function activeStreak(){
  let k=todayKey(),n=0;
  if(!getDay(k).workout)k=addDays(k,-1);
  while(getDay(k).workout){n++;k=addDays(k,-1)}
  return n;
}
function countDays(fn){return Object.values(state.days).filter(fn).length}
function cravingsAll(){return Object.entries(state.days).flatMap(([k,d])=>(d.cravings||[]).map(c=>Object.assign({day:k},c)))}
function badges(){
  const xp=totalXP(),active=countDays(d=>d.workout),cr=cravingsAll();
  return [
    {g:"E",n:"Eclosión",ok:stageOf(xp)>=1},
    {g:"1",n:"Primer paso",ok:active>=1},
    {g:"7",n:"Semana activa",ok:active>=7},
    {g:"21",n:"Constancia",ok:active>=21},
    {g:"P",n:"Pausa poderosa",ok:cr.filter(c=>c.outcome==="paso").length>=5},
    {g:"A",n:"Bien hidratado",ok:countDays(d=>(d.water||0)>=8)>=5},
    {g:"Y",n:"Me conozco",ok:countDays(d=>d.checkin)>=14},
    {g:"cm",n:"Primera medida",ok:state.waist.length>=1}
  ];
}

function accessoriesSVG(stage,wear){
  if(stage<1||!wear)return "";
  const A=stage===1?{top:76,eye:112,gap:17,neckY:140,neckW:47}:stage===2?{top:58,eye:94,gap:15,neckY:116,neckW:45}:{top:36,eye:72,gap:15,neckY:96,neckW:48};
  let s="";
  if(wear.neck==="bufanda"){
    s+=`<rect x="${100-A.neckW-3}" y="${A.neckY-7}" width="${2*A.neckW+6}" height="14" rx="7" fill="#e8394f"/>`+
       [0,1,2,3,4].map(i=>`<rect x="${100-A.neckW+8+i*((2*A.neckW-16)/5)}" y="${A.neckY-7}" width="6" height="14" fill="#fff" opacity=".55"/>`).join("")+
       `<rect x="${100+A.neckW-26}" y="${A.neckY}" width="13" height="30" rx="5" fill="#e8394f" transform="rotate(-8 ${100+A.neckW-20} ${A.neckY})"/><rect x="${100+A.neckW-26}" y="${A.neckY+22}" width="13" height="5" fill="#fff" opacity=".55" transform="rotate(-8 ${100+A.neckW-20} ${A.neckY})"/>`;
  }
  if(wear.neck==="mono"){
    s+=`<path d="M100 ${A.neckY} L82 ${A.neckY-10} L82 ${A.neckY+10} Z" fill="#8c7bff"/><path d="M100 ${A.neckY} L118 ${A.neckY-10} L118 ${A.neckY+10} Z" fill="#8c7bff"/><circle cx="100" cy="${A.neckY}" r="5" fill="#6b4fc8"/>`;
  }
  if(wear.eyes==="gafas"){
    const y=A.eye,g=A.gap;
    s+=`<rect x="${100-g-11}" y="${y-8}" width="22" height="15" rx="6" fill="#13233d"/><rect x="${100+g-11}" y="${y-8}" width="22" height="15" rx="6" fill="#13233d"/><path d="M${100-g+11} ${y-3} Q100 ${y-7} ${100+g-11} ${y-3}" stroke="#13233d" stroke-width="3" fill="none"/><path d="M${100-g-6} ${y-4} l6 0" stroke="#4db8ff" stroke-width="2" stroke-linecap="round"/><path d="M${100+g-6} ${y-4} l6 0" stroke="#4db8ff" stroke-width="2" stroke-linecap="round"/>`;
  }
  if(wear.head==="gorro"){
    const t=A.top;
    s+=`<path d="M${70} ${t+16} Q100 ${t-34} ${130} ${t+16} Z" fill="#2f6fdb"/><rect x="66" y="${t+8}" width="68" height="14" rx="7" fill="#ffd84d"/><circle cx="100" cy="${t-20}" r="9" fill="#ff6b81"/>`;
  }
  if(wear.head==="flores"){
    const t=A.top+6;
    s+=[-36,-18,0,18,36].map((dx,i)=>{const x=100+dx,y=t+Math.abs(dx)*.28;return `<g>${[0,72,144,216,288].map(a=>`<circle cx="${x+Math.cos(a*Math.PI/180)*5}" cy="${y+Math.sin(a*Math.PI/180)*5}" r="4" fill="${COLORS[i]}"/>`).join("")}<circle cx="${x}" cy="${y}" r="3" fill="#fff8d6"/></g>`}).join("");
  }
  if(wear.head==="audifonos"){
    const t=A.top,y=A.eye+4;
    s+=`<path d="M${100-A.neckW+4} ${y} Q${100-A.neckW+4} ${t-14} 100 ${t-14} Q${100+A.neckW-4} ${t-14} ${100+A.neckW-4} ${y}" stroke="#13233d" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="${100-A.neckW-6}" y="${y-12}" width="16" height="26" rx="7" fill="#ff6b81"/><rect x="${100+A.neckW-10}" y="${y-12}" width="16" height="26" rx="7" fill="#ff6b81"/>`;
  }
  return s;
}

function gemSVG(i,locked){

  const defs=g.c==="rainbow"&&!locked?`<defs><linearGradient id="gemrb${i}" x1="0" y1="0" x2="1" y2="1">${COLORS.map((c,j)=>`<stop offset="${j/5}" stop-color="${c}"/>`).join("")}</linearGradient></defs>`:"";
  return `<svg viewBox="0 0 48 48" role="img" aria-label="${locked?"Cristal por descubrir":esc(g.n)}">${defs}<path d="M14 6 H34 L44 18 L24 44 L4 18 Z" fill="${fill}" stroke="${locked?"var(--muted)":"rgba(0,0,0,.25)"}" stroke-width="1.2" stroke-linejoin="round"/>${locked?`<text x="24" y="24" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Fredoka, sans-serif">?</text>`:`<path d="M4 18 H44 M14 6 L18 18 L24 44 L30 18 L34 6 M18 18 L24 6 L30 18" stroke="#fff" stroke-opacity=".55" stroke-width="1" fill="none"/>`}</svg>`;
}
function penguin(stage,resting,progress,wear){
  if(wear===undefined)wear=state.profile.wear;
  const acc=accessoriesSVG(stage,wear);
  const defs=`<defs>
    <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">${COLORS.map((c,i)=>`<stop offset="${i/(COLORS.length-1)}" stop-color="${c}"/>`).join("")}</linearGradient>
    <linearGradient id="rbv" x1="0" y1="0" x2="0" y2="1">${COLORS.slice().reverse().map((c,i)=>`<stop offset="${i/(COLORS.length-1)}" stop-color="${c}"/>`).join("")}</linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#ffffff" stop-opacity=".0"/><stop offset=".55" stop-color="#8c7bff" stop-opacity=".25"/><stop offset=".8" stop-color="#4db8ff" stop-opacity=".18"/><stop offset="1" stop-color="#5fd38d" stop-opacity="0"/></radialGradient>
  </defs>`;
  const shadow=`<ellipse cx="100" cy="186" rx="46" ry="7" fill="#000" opacity=".12"/>`;
  const eyes=(y,gap,r)=>resting
    ?`<path d="M${100-gap-r} ${y} q${r} ${r*.9} ${r*2} 0" stroke="#13233d" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M${100+gap-r} ${y} q${r} ${r*.9} ${r*2} 0" stroke="#13233d" stroke-width="3" fill="none" stroke-linecap="round"/>`
    :`<circle cx="${100-gap}" cy="${y}" r="${r}" fill="#13233d"/><circle cx="${100+gap}" cy="${y}" r="${r}" fill="#13233d"/><circle cx="${100-gap+r*.35}" cy="${y-r*.35}" r="${r*.32}" fill="#fff"/><circle cx="${100+gap+r*.35}" cy="${y-r*.35}" r="${r*.32}" fill="#fff"/>`;
  const zz=resting?`<text x="150" y="40" font-family="Fredoka, sans-serif" font-size="18" fill="#8c7bff">z</text><text x="162" y="26" font-family="Fredoka, sans-serif" font-size="13" fill="#4db8ff">z</text>`:"";
  const beak=(y,w)=>`<path d="M${100-w} ${y} L${100+w} ${y} L100 ${y+w*1.3} Z" fill="#ff9f43" stroke="#e07b1f" stroke-width="1.2" stroke-linejoin="round"/>`;
  const feet=(y,sp)=>`<ellipse cx="${100-sp}" cy="${y}" rx="11" ry="5" fill="#ff9f43"/><ellipse cx="${100+sp}" cy="${y}" rx="11" ry="5" fill="#ff9f43"/>`;
  const cheeks=(y,gap)=>`<ellipse cx="${100-gap}" cy="${y}" rx="6" ry="3.5" fill="#ff6b81" opacity=".45"/><ellipse cx="${100+gap}" cy="${y}" rx="6" ry="3.5" fill="#ff6b81" opacity=".45"/>`;
  const crest=(cx,cy,n,len)=>{let s="";for(let i=0;i<n;i++){const a=-90+(i-(n-1)/2)*18;const rad=a*Math.PI/180;const x=cx+Math.cos(rad)*len,y=cy+Math.sin(rad)*len;s+=`<path d="M${cx} ${cy} Q${(cx+x)/2+6} ${(cy+y)/2} ${x} ${y}" stroke="${COLORS[i%COLORS.length]}" stroke-width="5" fill="none" stroke-linecap="round"/>`}return s};
  let body="";
  if(stage===0){
    const crack=progress>.5?`<path d="M74 104 l8 8 l7 -9 l8 9 l8 -8 l8 8 l9 -7" stroke="#13233d" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${Math.min(1,(progress-.5)*2.4)}"/>`:"";
    const spots=[[80,92,7,0],[118,84,6,1],[100,128,9,2],[72,136,6,3],[128,124,7,4],[96,70,5,5],[124,150,5,0],[84,160,6,4]];
    body=`${shadow}<g class="${progress>.5?"wiggle":"bob"}"><ellipse cx="100" cy="120" rx="50" ry="64" fill="#f7f4ee" stroke="#d9d2c4" stroke-width="2"/>${spots.map(s=>`<circle cx="${s[0]}" cy="${s[1]}" r="${s[2]}" fill="${COLORS[s[3]]}" opacity=".9"/>`).join("")}${crack}</g>`;
  }else if(stage===1){
    const fluff=[...Array(12)].map((_,i)=>{const a=i/12*Math.PI*2;return `<circle cx="${100+Math.cos(a)*50}" cy="${126+Math.sin(a)*48}" r="10" fill="${COLORS[i%6]}"/>`}).join("");
    body=`${shadow}<g class="bob">${fluff}<circle cx="100" cy="126" r="52" fill="url(#rb)"/><ellipse cx="100" cy="142" rx="32" ry="30" fill="#fffaf2"/>${crest(100,76,3,14)}${eyes(112,17,7)}${beak(122,7)}${cheeks(126,30)}${feet(180,18)}${acc}</g>`;
  }else{
    const big=stage>=3;
    const ry=big?74:62,cy=big?110:120,rx=big?50:46;
    const tail=big?COLORS.map((c,i)=>`<path d="M100 ${cy+ry-12} Q${70+i*12} ${cy+ry+10} ${62+i*15} ${cy+ry+4}" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round"/>`).join(""):"";
    const fl=`<ellipse cx="${100-rx-2}" cy="${cy+8}" rx="11" ry="${big?34:28}" fill="url(#rbv)" transform="rotate(14 ${100-rx-2} ${cy+8})"/><ellipse cx="${100+rx+2}" cy="${cy+8}" rx="11" ry="${big?34:28}" fill="url(#rbv)" transform="rotate(-14 ${100+rx+2} ${cy+8})"/>`;
    const aura=stage===4?`<circle cx="100" cy="110" r="96" fill="url(#aura)"/>${[[30,40],[170,56],[24,130],[176,140],[60,18]].map(([x,y],i)=>`<path d="M${x} ${y-7} L${x+2} ${y-2} L${x+7} ${y} L${x+2} ${y+2} L${x} ${y+7} L${x-2} ${y+2} L${x-7} ${y} L${x-2} ${y-2} Z" fill="${COLORS[i]}"/>`).join("")}`:"";
    body=`${aura}${shadow}<g class="bob">${tail}${fl}<ellipse cx="100" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#rb)"/><ellipse cx="100" cy="${cy+18}" rx="${rx-16}" ry="${ry-20}" fill="#fffaf2"/>${crest(100,cy-ry+6,big?5:3,big?24:14)}${eyes(cy-ry+36,15,6)}${beak(cy-ry+44,7)}${cheeks(cy-ry+50,27)}${feet(cy+ry+4,18)}${acc}</g>`;
  }
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Tu pingüino, etapa ${STAGES[stage].n}">${defs}${body}${zz}</svg>`;
}

/* ---------- Vistas ---------- */
function greet(){const h=new Date().getHours();return h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches"}
function dateLabel(){return new Date().toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"})}
function petMessage(stage,rec,d,progress){
  const p=esc(state.profile.pet);
  if(d.workout)return stage===0?"¡El huevo se calentó mucho hoy! Gracias por moverte.":`${p} está feliz: hoy se movieron juntos.`;
  if(!d.checkin)return stage===0?"Este huevo es tuyo. Cuéntame cómo amaneciste y armamos el plan de hoy.":`Hola, soy ${p}. ¿Cómo te sientes hoy?`;
  if(rec.flags.includes("late"))return "Ya es tarde para entrenar fuerte. Estiramos un poco y a descansar.";
  if(rec.mode!=="normal")return `Hoy vamos con calma. Lo poco que hagas también me alimenta.`;
  if(stage===0&&progress>.5)return "¡Algo se mueve adentro! Falta poco para nacer.";
  return "Listo para nuestra rutina. Tú pones el ritmo.";
}
function petCard(){
  const xp=totalXP(),st=stageOf(xp),next=STAGES[st+1];
  const base=STAGES[st].xp,prog=next?(xp-base)/(next.xp-base):1;
  const d=getDay(todayKey()),rec=recommend();
  const resting=!!(d.checkin&&!d.workout&&rec.mode!=="normal");
  return `<section class="card pet-card" aria-label="Tu pingüino">
    <div class="pet-wrap">
      <div class="pet" style="${petBg()}">${penguin(st,resting,prog)}</div>
      <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <div class="row between"><h2>${esc(state.profile.pet)}</h2><span class="pill">${STAGES[st].n}</span></div>
        <div class="bubble">${petMessage(st,rec,d,prog)}</div>
        <div class="xpbar" aria-hidden="true"><i style="width:${Math.round(prog*100)}%"></i></div>
        <div class="small muted">${next?`${xp-base} de ${next.xp-base} de energía para llegar a ${next.n}`:"Llegó a su forma final. Sigue sumando energía."}</div>
      </div>
    </div>
  </section>`;
}

function alerts(){
  const rec=recommend(),t=trends();let out="";
  if(rec.flags.includes("high"))out+=`<div class="banner warn"><div><b>Mucha energía y poco sueño</b>Hoy haz el plan normal, sin agregar más. Termina antes de las ${limitLabel()} y prioriza dormir.${t.high>=3?" Llevas varios días así: vale la pena contárselo a tu psiquiatra.":""}</div></div>`;
  else if(t.high>=3)out+=`<div class="banner warn"><div><b>Varios días con poco sueño y mucha energía</b>Puede ser buena idea contárselo a tu psiquiatra.</div></div>`;
  if(t.low>=5)out+=`<div class="banner calm"><div><b>Llevas varios días con ánimo bajo</b>Lo estás haciendo bien al registrarlo. Puede ayudar hablarlo con tu psiquiatra o con alguien de confianza. Si sientes que estás en peligro: Línea Nacional 106 (24 h) o 123.<br><button class="link" data-act="plan-open">Abrir mi plan para días difíciles</button></div></div>`;

function moodChart(){
  const W=320,H=150,pl=64,pr=8,pt=10,pb=24;const n=14;
  const xs=i=>pl+(W-pl-pr)*i/(n-1),ys=v=>pt+(H-pt-pb)*(1-(v-1)/4);
  const keys=[...Array(n)].map((_,i)=>addDays(todayKey(),i-n+1));
  const pts=f=>keys.map((k,i)=>{const c=getDay(k).checkin;return c?[xs(i),ys(c[f])]:null});
  const line=(p,color,dash)=>{let segs=[],cur=[];p.forEach(q=>{if(q)cur.push(q);else{if(cur.length)segs.push(cur);cur=[]}});if(cur.length)segs.push(cur);
    return segs.map(s=>s.length>1?`<polyline points="${s.map(q=>q.join(",")).join(" ")}" fill="none" stroke="${color}" stroke-width="2.5" ${dash?'stroke-dasharray="5 4"':""} stroke-linecap="round" stroke-linejoin="round"/>`:"").join("")+p.filter(Boolean).map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="${color}"/>`).join("")};
  const has=keys.some(k=>getDay(k).checkin);
  const grid=[1,3,5].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${ys(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v===1?"Muy bajo":v===3?"Estable":"Muy alto"}</text>`).join("");
  const xl=keys.map((k,i)=>i%2===(n-1)%2?`<text x="${xs(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${parseKey(k).getDate()}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ánimo y energía de los últimos 14 días">${grid}${xl}${has?line(pts("energy"),"#4db8ff",true)+line(pts("mood"),"#ff6b81",false):`<text x="${(W+pl)/2}" y="${H/2}" text-anchor="middle" font-size="12" fill="var(--muted)">Aparecerá con tus registros diarios</text>`}</svg>

}

function buildSummary(){
  const end=todayKey(),start=addDays(end,-27);
  const keys=[...Array(28)].map((_,i)=>addDays(start,i));
  const cs=keys.map(k=>getDay(k).checkin).filter(Boolean);
  const avg=f=>cs.length?(cs.reduce((a,c)=>a+c[f],0)/cs.length):0;
  const low=cs.filter(c=>c.mood<=2).length;
  const elevated=cs.filter(c=>c.mood>=5||(c.energy>=4&&c.sleep<6)).length;
  const shortSleep=cs.filter(c=>c.sleep<6).length;
  const meds=state.profile.meds||[];
  let medLine="No registrado en la app.";
  if(meds.length){
    let total=0,taken=0;
    keys.forEach(k=>{if(k<state.profile.start)return;meds.forEach(m=>{total++;const d=getDay(k);if(d.meds&&d.meds[m.id])taken++})});
    medLine=total?`${Math.round(taken/total*100)}% de las tomas marcadas (${taken} de ${total}).`:"Sin datos aún.";
  }
  const active=keys.filter(k=>getDay(k).workout).length;
  const cr=keys.flatMap(k=>getDay(k).cravings||[]);
  const emo={};cr.filter(c=>c.emotion).forEach(c=>emo[c.emotion]=(emo[c.emotion]||0)+1);
  const topE=Object.entries(emo).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>`${e[0]} (${e[1]})`).join(", ");
  const fmt=k=>parseKey(k).toLocaleDateString("es-CO",{day:"numeric",month:"short"});
  const moodWord=v=>v?MOOD[Math.round(v)-1].toLowerCase():"sin datos";
  const lines=[
    `Resumen Ritmo · ${fmt(start)} al ${fmt(end)}`,
    ``,
    `Registros diarios: ${cs.length} de 28 días.`,
    cs.length?`Ánimo promedio: ${avg("mood").toFixed(1)} de 5 (${moodWord(avg("mood"))}). Escala: 1 muy bajo, 3 estable, 5 muy acelerado.`:"Ánimo: sin registros.",
    cs.length?`Energía promedio: ${avg("energy").toFixed(1)} de 5.`:"",
    cs.length?`Sueño promedio: ${avg("sleep").toFixed(1)} h. Noches con menos de 6 h: ${shortSleep}.`:"",
    `Días con ánimo bajo (1–2): ${low}.`,
    `Días con ánimo muy alto o mucha energía con poco sueño: ${elevated}.`,
    `Medicación: ${medLine}`,
    `Días con actividad física: ${active}.`,
    `Antojos registrados: ${cr.length}${cr.length?` (superados: ${cr.filter(c=>c.outcome==="paso").length})`:""}.${topE?` Emociones más frecuentes: ${topE}.`:""}`
  ].filter(l=>l!=="");
  return {text:lines.join("\n"),keys};
}
function summaryChart(keys){
  const W=320,H=120,pl=8,pr=8,pt=10,pb=18;
  const xs=i=>pl+(W-pl-pr)*i/(keys.length-1),ys=v=>pt+(H-pt-pb)*(1-(v-1)/4);
  const bars=keys.map((k,i)=>{const c=getDay(k).checkin;if(!c)return "";const col=c.mood<=2?"#4db8ff":c.mood>=5?"#ff6b81":"#5fd38d";return `<rect x="${xs(i)-4}" y="${ys(c.mood)}" width="8" height="${H-pb-ys(c.mood)}" rx="3" fill="${col}"/>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ánimo de las últimas 4 semanas"><line x1="${pl}" x2="${W-pr}" y1="${ys(3)}" y2="${ys(3)}" stroke="var(--line)" stroke-dasharray="4 4"/><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${bars}<text x="${pl}" y="${H-4}" font-size="9" fill="var(--muted)">${parseKey(keys[0]).toLocaleDateString("es-CO",{day:"numeric",month:"short"})}</text><text x="${W-pr}" y="${H-4}" font-size="9" text-anchor="end" fill="var(--muted)">Hoy</text></svg>
  <div class="row small"><span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:#4db8ff;display:inline-block"></i>Bajo</span><span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:#5fd38d;display:inline-block"></i>Estable / animado</span><span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:#ff6b81;display:inline-block"></i>Muy acelerado</span></div>`;
}

function confetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=document.getElementById("confetti");cv.style.display="block";
  const ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const parts=[...Array(70)].map(()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vy:1.5+Math.random()*2.5,vx:-1+Math.random()*2,r:Math.random()*Math.PI,vr:-.08+Math.random()*.16,c:COLORS[Math.floor(Math.random()*6)],s:8+Math.random()*8}));
  const t0=performance.now();
  (function frame(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p=>{p.x+=p.vx+Math.sin((t+p.s*90)/400)*.6;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,p.s*.35,p.s,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.6)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-p.s);ctx.lineTo(0,p.s);ctx.stroke();ctx.restore()});
    if(t-t0<3200)requestAnimationFrame(frame);else{ctx.clearRect(0,0,innerWidth,innerHeight);cv.style.display="none"}
  })(t0);
}

/* ---------- Rutina guiada ---------- */
let P=null,pTimer=null,actx=null;
function beep(f=880,d=.15){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d)}catch(e){}}
function startPlayer(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){actx=null}
  const rec=recommend(),mode=ui.mode||rec.mode;
  const plan=buildPlan(weekNum(),mode,state.profile.kind||"fuerza");
  P={mode,steps:plan.steps,i:0,left:plan.steps[0].s,running:true,last:Date.now()};
  document.getElementById("player").classList.add("open");
  renderPlayer();
  clearInterval(pTimer);
  pTimer=setInterval(tick,200);
}
function tick(){
  if(!P||!P.running){if(P)P.last=Date.now();return}
  const now=Date.now();P.left-=(now-P.last)/1000;P.last=now;
  if(P.left<=3.2&&P.left>0&&Math.ceil(P.left)!==P.beeped){P.beeped=Math.ceil(P.left);beep(660,.08)}
  if(P.left<=0){
    P.i++;beep(990,.2);
    if(P.i>=P.steps.length){finishPlayer();return}
    P.left=P.steps[P.i].s;P.beeped=null;renderPlayer();return;
  }
  updatePlayerTime();
}
function updatePlayerTime(){
  const s=P.steps[P.i];const t=document.getElementById("pt"),c=document.getElementById("pc");
  if(t)t.textContent=Math.max(0,Math.ceil(P.left));
  if(c){const L=2*Math.PI*96;c.setAttribute("stroke-dashoffset",String(L*(1-Math.max(0,P.left)/s.s)))}
}
function renderPlayer(){
  const s=P.steps[P.i],nx=P.steps[P.i+1],L=2*Math.PI*96;
  const total=P.steps.length;
  document.getElementById("playerBody").innerHTML=`
    <div class="row between"><span class="pill">${P.i+1} de ${total}${s.round?" · Ronda "+s.round:""}</span><button class="x link" data-act="p-exit">Salir</button></div>

    <div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" stroke="var(--line)" stroke-width="12" fill="none"/><circle id="pc" cx="110" cy="110" r="96" stroke="${s.rest?"#4db8ff":"var(--accent)"}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-P.left/s.s)}"/></svg><div class="t" id="pt">${Math.ceil(P.left)}</div></div>
    <div class="ex-name">${s.n}</div>
    <p class="ex-cue">${s.c}</p>
    <p class="small muted" style="text-align:center;margin:0">${nx?"Sigue: "+nx.n:"Último paso"}</p>
    <div style="flex:1"></div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn ghost full" data-act="p-toggle">${P.running?"Pausar":"Seguir"}</button><button class="btn soft full" data-act="p-skip">Saltar</button></div>
    <p class="small muted" style="text-align:center;margin:0">Si algo duele (no es solo esfuerzo), para y salta ese ejercicio.</p>`;
}

    case "tab":ui.tab=el.dataset.tab;render();window.scrollTo(0,0);break;
    case "name-pet":{const n=(document.getElementById("petName").value||"").trim().slice(0,20)||"Iris";state.profile.pet=n;state.profile.named=true;save();render();toast(`¡Hola, ${n}!`);break}
    case "ci":{const f=el.dataset.f;ui.ci[f]=f==="sleep"?parseFloat(v):parseInt(v,10);render();break}
    case "edit-checkin":ui.editCheckin=true;ui.ci=Object.assign({},getDay(today).checkin||{});render();break;
    case "save-checkin":{const c=ui.ci;if(!(c.mood&&c.energy&&c.sleep))return;withEvolution(()=>{editDay(today).checkin={mood:c.mood,energy:c.energy,sleep:c.sleep,t:Date.now()}});ui.editCheckin=false;ui.ci={};ui.mode=null;render();break}
    case "mode":ui.mode=el.dataset.m;render();break;
    case "start":startPlayer();break;
    case "done-manual":{const m=ui.mode||recommend().mode;withEvolution(()=>{const d=editDay(today);d.workout=m;d.kind=state.profile.kind||"fuerza"});break}
    case "kind":state.profile.kind=v;save();render();break;
    case "undo-workout":{const d=editDay(today);delete d.workout;delete d.kind;save();render();break}
    case "water":{const n=parseInt(v,10);withEvolution(()=>{const d=editDay(today);d.water=(d.water===n?n-1:n)});break}
    case "habit":withEvolution(()=>{const d=editDay(today);d.habit=!d.habit});break;
    case "waist":{const cm=parseFloat(document.getElementById("waistIn").value);if(!(cm>=40&&cm<=200)){toast("Escribe una medida entre 40 y 200 cm");return}withEvolution(()=>{state.waist=state.waist.filter(x=>x.date!==today);state.waist.push({date:today,cm:Math.round(cm*10)/10})});toast("Medida guardada");break}
    case "settings":{const n=(document.getElementById("setPet").value||"").trim().slice(0,20);const b=document.getElementById("setBed").value;const s=document.getElementById("setStart").value;if(n){state.profile.pet=n;state.profile.named=true}if(/^\d{2}:\d{2}$/.test(b))state.profile.bedtime=b;if(/^\d{4}-\d{2}-\d{2}$/.test(s)&&s<=today)state.profile.start=s;save();render();toast("Ajustes guardados");break}
    case "crave-open":ui.crave={step:"start"};openSheet();break;
    case "crave-close":closeSheet();break;
    case "crave-kind":ui.crave.kind=v;ui.crave.step=v==="fisico"?"fisico":"emotion";renderCrave();break;
    case "crave-emo":ui.crave.emotion=v;renderCrave();break;
    case "crave-pause":ui.crave.step="pause";ui.crave.begin=Date.now();ui.crave.end=Date.now()+300000;renderCrave();break;
    case "crave-skip":clearInterval(craveTimer);ui.crave.step="outcome";renderCrave();break;
    case "crave-save":{
      clearInterval(craveTimer);const c=ui.crave;c.outcome=v;
      const xp0=totalXP(),sup0=superados();
      withEvolution(()=>{const d=editDay(today);d.cravings=d.cravings||[];d.cravings.push({t:Date.now(),kind:c.kind||"emocional",emotion:c.kind==="fisico"?null:(c.emotion||null),outcome:v})});
      c.gain=totalXP()-xp0;
      if(v==="paso"){
        c.sup=superados();c.msg=pick(CHEERS);
        c.gem=sup0<GEMS.length?sup0:null;
        const na=ACCS.find(a=>a.at===c.sup&&a.at>sup0);
        c.acc=na?na.id:null;
        if(na&&stageOf(totalXP())>=1){state.profile.wear=Object.assign({},state.profile.wear,{[na.slot]:na.id});save();render()}
        confetti();
      }else if(v!=="fisico"){c.msg=pick(AFFIRM[v])}
      c.step="done";renderCrave();break}
    case "recipe-cat":ui.recipeFilter=v;render();break;
    case "theme":state.profile.theme=v;save();render();break;
    case "wear":{const a=ACCS.find(x=>x.id===v);if(!a||!unlocked(a))return;const w=Object.assign({},state.profile.wear);w[a.slot]=w[a.slot]===a.id?null:a.id;state.profile.wear=w;save();render();break}
    case "med":withEvolution(()=>{const d=editDay(today);d.meds=Object.assign({},d.meds||{});d.meds[v]=!d.meds[v]});break;
    case "med-add":{const n=(document.getElementById("medName").value||"").trim().slice(0,40);const t=document.getElementById("medTime").value;if(!n){toast("Escribe el nombre del medicamento");return}state.profile.meds=(state.profile.meds||[]).concat([{id:"m"+Date.now().toString(36),name:n,time:/^\d{2}:\d{2}$/.test(t)?t:"08:00"}]);save();render();toast("Medicamento agregado");setTimeout(()=>{const m=document.getElementById("meds");if(m)m.scrollIntoView({block:"start"})},30);break}
    case "med-del":{state.profile.meds=(state.profile.meds||[]).filter(m=>m.id!==v);save();render();setTimeout(()=>{const m=document.getElementById("meds");if(m)m.scrollIntoView({block:"start"})},30);break}
    case "goto-meds":ui.tab="progreso";render();setTimeout(()=>{const m=document.getElementById("meds");if(m)m.scrollIntoView({behavior:"smooth",block:"start"})},30);break;
    case "summary":openSummary();break;
    case "ex-info":openExInfo(v);break;
    case "install":if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}break;
    case "backup-copy":{const t=JSON.stringify(state);try{navigator.clipboard.writeText(t).then(()=>toast("Datos copiados. Pégalos en la otra versión."),()=>toast("No se pudo copiar"))}catch(e){toast("No se pudo copiar")}break}
    case "backup-download":{try{const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ritmo-copia-"+todayKey()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast("No se pudo descargar")}break}
    case "backup-restore":{const t=(document.getElementById("restoreText")||{}).value||"";if(!t.trim()){toast("Pega primero el texto de tu copia");return}restoreFrom(t.trim());break}
    case "plan-open":openPlan(false);break;
    case "plan-edit":openPlan(true);break;
    case "plan-save":{const pl={};PLAN_FIELDS.forEach(f=>{const el=document.getElementById("pl_"+f.k);pl[f.k]=(el?el.value:"").slice(0,600)});state.profile.plan=pl;save();render();openPlan(false);toast("Plan guardado");break}
    case "bg":{const i=BACKS.findIndex(x=>x.id===v);if(i<0||i>=completedChallenges())return;state.profile.bg=state.profile.bg===v?null:v;save();render();break}
    case "copy-summary":{const t=buildSummary().text;try{navigator.clipboard.writeText(t).then(()=>toast("Resumen copiado"),()=>toast("No se pudo copiar. Mantén presionado el texto para copiarlo."))}catch(e){toast("No se pudo copiar. Mantén presionado el texto para copiarlo.")}break}
    case "p-toggle":if(P){P.running=!P.running;P.last=Date.now();renderPlayer()}break;
    case "p-skip":if(P){P.left=0;P.running=true;P.last=Date.now();tick()}break;
    case "p-exit":exitPlayer();break;
  }
});
document.addEventListener("change",e=>{if(e.target&&e.target.id==="backupFile"&&e.target.files&&e.target.files[0]){const r=new FileReader();r.onload=()=>restoreFrom(String(r.result||""));r.readAsText(e.target.files[0])}});
document.getElementById("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.getElementById("sheet").classList.contains("open"))closeSheet()}});

connect();
</script>
</body>
</html>
